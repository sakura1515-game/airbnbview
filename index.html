<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>숙소 모니터링</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #141c2e;
      --card-border: #23314e;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #38bdf8;
      --red: #f43f5e;
      --green: #10b981;
      --yellow: #f59e0b;
      --blue: #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text-main); padding-bottom: 70px; }

    /* PIN 인증 잠금 화면 */
    #lock-screen {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: var(--bg); z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px;
    }
    .lock-box {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 16px; padding: 28px 20px; width: 100%; max-width: 320px; text-align: center;
    }
    .lock-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 8px; color: #fff; }
    .lock-sub { font-size: 0.75rem; color: var(--text-sub); margin-bottom: 20px; }
    .pin-input {
      width: 100%; height: 46px; background: rgba(255,255,255,0.05);
      border: 1px solid var(--accent); border-radius: 8px;
      color: #fff; font-size: 1.3rem; letter-spacing: 12px; text-align: center;
      outline: none; margin-bottom: 16px;
    }
    .pin-btn {
      width: 100%; height: 44px; background: var(--accent); color: #000;
      border: none; border-radius: 8px; font-weight: 700; font-size: 0.9rem; cursor: pointer;
    }
    .pin-err { font-size: 0.75rem; color: var(--red); margin-top: 10px; display: none; }

    /* 헤더 */
    .header { padding: 14px 16px 10px; background: var(--bg); position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .header h1 { font-size: 1.1rem; font-weight: 700; color: #fff; }
    .header .time { font-size: 0.72rem; color: var(--text-sub); }

    /* 탭 바 */
    .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 56px; background: #0c1322; border-top: 1px solid var(--card-border); display: flex; z-index: 200; }
    .tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.72rem; color: var(--text-sub); cursor: pointer; }
    .tab-item.active { color: var(--accent); font-weight: 700; }
    .tab-item .icon { font-size: 1.1rem; margin-bottom: 2px; }

    /* 공통 컨테이너 */
    .tab-content { display: none; padding: 12px; }
    .tab-content.active { display: block; }
    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    .card-title { font-size: 0.88rem; font-weight: 600; color: var(--accent); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }

    /* 점유율 KPI */
    .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .kpi-box { background: rgba(255,255,255,0.03); border: 1px solid var(--card-border); border-radius: 8px; padding: 8px 4px; text-align: center; }
    .kpi-box .label { font-size: 0.65rem; color: var(--text-sub); margin-bottom: 2px; }
    .kpi-box .val { font-size: 1rem; font-weight: 700; }
    .kpi-box .diff { font-size: 0.65rem; font-weight: 600; margin-top: 2px; }
    .plus { color: var(--green); }
    .minus { color: var(--red); }

    /* 긴급 조정 배너 */
    .action-item { background: rgba(244,63,94,0.08); border-left: 3px solid var(--red); padding: 10px; border-radius: 6px; margin-bottom: 6px; font-size: 0.8rem; }
    .action-top { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 2px; }
    .action-price { color: var(--red); font-weight: 700; }
    .action-desc { font-size: 0.72rem; color: var(--text-sub); }

    /* 버튼류 */
    .filter-tabs { display: flex; gap: 6px; margin-bottom: 10px; }
    .filter-btn { flex: 1; padding: 7px; font-size: 0.75rem; border-radius: 6px; border: 1px solid var(--card-border); background: var(--card-bg); color: var(--text-sub); cursor: pointer; }
    .filter-btn.active { background: var(--accent); color: #000; font-weight: 700; border-color: var(--accent); }
    .switch-mode-btn { background: rgba(56,189,248,0.12); border: 1px solid var(--accent); color: var(--accent); font-weight: 700; padding: 5px 10px; border-radius: 6px; font-size: 0.72rem; cursor: pointer; display: flex; align-items: center; gap: 4px; }

    /* 리스트 뷰 */
    .daily-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 4px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .date-col { width: 64px; }
    .date-main { font-size: 0.85rem; font-weight: 700; }
    .date-sub { font-size: 0.68rem; color: var(--text-sub); }
    .status-badge { padding: 3px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: 600; text-align: center; }
    .status-vacant { background: rgba(16,185,129,0.15); color: var(--green); }
    .status-booked { background: rgba(148,163,184,0.15); color: var(--text-sub); }
    .status-closed { background: rgba(59,130,246,0.15); color: var(--blue); }
    .price-col { text-align: right; flex: 1; padding-right: 8px; }
    .price-curr { font-size: 0.85rem; font-weight: 700; }
    .price-sugg { font-size: 0.7rem; color: var(--accent); }
    .market-col { width: 40px; text-align: right; font-size: 0.75rem; font-weight: 600; color: var(--yellow); }

    /* 대시보드 매트릭스 테이블 & 2D Sticky */
    .matrix-wrapper {
      position: relative; overflow-x: auto; overflow-y: auto;
      max-height: calc(100vh - 145px); -webkit-overflow-scrolling: touch;
      border: 1px solid var(--card-border); border-radius: 10px; background: var(--card-bg);
    }
    .matrix-table { border-collapse: separate; border-spacing: 0; font-size: 0.7rem; white-space: nowrap; text-align: center; }
    .matrix-table th, .matrix-table td {
      border-bottom: 1px solid rgba(255,255,255,0.07);
      border-right: 1px solid rgba(255,255,255,0.05);
      padding: 6px 3px;
    }
    .matrix-table thead th { position: sticky; top: 0; background: #192338; z-index: 20; font-weight: 600; height: 34px; }

    /* [기본 뷰] 좌측 3열 고정 */
    .col-fixed-1 { position: sticky; left: 0; width: 41px; min-width: 41px; max-width: 41px; background: #121929; z-index: 10; font-size: 0.68rem; padding: 6px 1px !important; }
    .col-fixed-2 { position: sticky; left: 41px; width: 46px; min-width: 46px; background: #121929; z-index: 10; }
    .col-fixed-3 { position: sticky; left: 87px; width: 68px; min-width: 68px; background: #16243d; border-right: 2px solid var(--accent) !important; box-shadow: 3px 0 8px rgba(0,0,0,0.5); z-index: 10; }
    thead th.col-fixed-1 { z-index: 30; background: #192338; }
    thead th.col-fixed-2 { z-index: 30; background: #192338; }
    thead th.col-fixed-3 { z-index: 30; background: #203152; color: var(--accent); }

    /* [타임라인 뷰] 좌측 1열(숙소명) 고정 */
    .col-fixed-trans {
      position: sticky; left: 0; width: 72px; min-width: 72px; max-width: 72px;
      background: #121929; z-index: 15; font-weight: 600; text-align: left;
      padding-left: 6px !important; border-right: 2px solid var(--accent) !important;
      box-shadow: 3px 0 8px rgba(0,0,0,0.5); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-size: 0.68rem;
    }
    .col-fixed-trans.is-my { background: #16243d; color: var(--accent); }

    .row-sticky-market td { position: sticky; top: 34px; background: #172033; z-index: 20; height: 34px; }
    .row-sticky-market td.col-fixed-trans { z-index: 35; background: #192338; top: 34px; }

    .row-sticky-my td {
      position: sticky; top: 68px; background: #1a2942; z-index: 20; height: 38px;
      border-bottom: 2px solid var(--accent) !important; box-shadow: 0 3px 6px rgba(0,0,0,0.4);
    }
    .row-sticky-my td.col-fixed-trans { z-index: 35; background: #203152; top: 68px; }

    thead th.col-fixed-trans { z-index: 40; background: #203152; color: var(--accent); top: 0; }

    .col-comp { width: 68px; min-width: 68px; }
    .col-day-trans { width: 58px; min-width: 58px; }

    @media (min-width: 600px) {
      .col-fixed-1 { width: 48px; min-width: 48px; max-width: 48px; font-size: 0.72rem; }
      .col-fixed-2 { left: 48px; width: 52px; min-width: 52px; }
      .col-fixed-3 { left: 100px; width: 76px; min-width: 76px; }
      .col-fixed-trans { width: 90px; min-width: 90px; max-width: 90px; font-size: 0.75rem; padding-left: 8px !important; }
      .col-comp { width: 74px; min-width: 74px; }
      .col-day-trans { width: 64px; min-width: 64px; }
    }

    .cell-box { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
    .cell-badge { font-size: 0.65rem; padding: 1px 4px; border-radius: 3px; font-weight: 600; }
    .cell-price { font-size: 0.72rem; font-weight: 700; color: #fff; }
    .day-sat { color: var(--blue); }
    .day-sun { color: var(--red); }

    /* 프로필 카드 스타일 */
    .p-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    .p-card.is-my { border: 2px solid var(--accent); background: rgba(56,189,248,0.03); }
    .p-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
    .p-title-link { font-size: 0.95rem; font-weight: 700; color: #fff; text-decoration: none; }
    .p-badge { font-size: 0.68rem; font-weight: 700; padding: 3px 6px; border-radius: 4px; }
    .badge-my { background: var(--accent); color: #000; }
    .badge-comp { background: rgba(255,255,255,0.08); color: var(--text-sub); }
    .p-specs { font-size: 0.75rem; color: var(--text-sub); line-height: 1.45; margin-bottom: 12px; }
    .p-pricing-box { background: rgba(0,0,0,0.3); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.04); }
    .p-price-row { display: flex; justify-content: space-between; font-size: 0.82rem; margin-bottom: 4px; }
    .p-matrix { width: 100%; border-collapse: collapse; font-size: 0.72rem; text-align: center; }
    .p-matrix th, .p-matrix td { padding: 6px 4px; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .p-matrix td:first-child { text-align: left; }
    .occ-high { color: var(--green); font-weight: 700; }
    .occ-mid { color: var(--yellow); font-weight: 700; }
    .occ-low { color: var(--red); font-weight: 700; }

    /* 진단 리포트 */
    .audit-table { width: 100%; border-collapse: collapse; font-size: 0.72rem; margin-top: 6px; }
    .audit-table th, .audit-table td { padding: 6px; border: 1px solid var(--card-border); text-align: left; }
    .audit-table th { background: rgba(255,255,255,0.05); color: var(--text-sub); }

    #loading { text-align: center; padding: 80px 0; color: var(--text-sub); font-size: 0.9rem; }
    .spinner { width: 34px; height: 34px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div id="lock-screen">
    <div class="lock-box">
      <div class="lock-title">🔐 모니터링 시스템</div>
      <div class="lock-sub">접근 비밀번호 4자리를 입력하세요.</div>
      <input type="password" id="pin-input" class="pin-input" maxlength="4" pattern="[0-9]*" inputmode="numeric" placeholder="••••" autofocus>
      <button class="pin-btn" onclick="verifyPin()">대시보드 열기</button>
      <div id="pin-err" class="pin-err">비밀번호가 올바르지 않습니다.</div>
    </div>
  </div>

  <div class="header">
    <h1>에어비앤비 모니터링</h1>
    <div class="time" id="updated-at">-</div>
  </div>

  <div id="loading">
    <div class="spinner"></div>
    시트 데이터를 분석하는 중...
  </div>

  <div id="app" style="display:none;">
    
    <!-- 탭 1: 종합 대시보드 -->
    <div id="tab-dash" class="tab-content active">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <span id="matrix-guide-text" style="font-size:0.73rem; color:var(--text-sub);">날짜(세로) 뷰 (3열 고정)</span>
        <button class="switch-mode-btn" onclick="toggleMatrixMode()">
          <span id="btn-mode-icon">⇄</span> <span id="btn-mode-text">숙소 기준(가로 타임라인)</span>
        </button>
      </div>
      <div class="matrix-wrapper">
        <table class="matrix-table" id="matrix-table">
          <thead id="matrix-head"></thead>
          <tbody id="matrix-body"></tbody>
        </table>
      </div>
    </div>

    <!-- 탭 2: 가격 추천 & 진단 -->
    <div id="tab-rec" class="tab-content">
      <div class="card">
        <div class="card-title">점유율 비교 (내 숙소 vs 시장 평균)</div>
        <div class="kpi-grid">
          <div class="kpi-box">
            <div class="label">30일 전체</div>
            <div class="val" id="kpi-30">-</div>
            <div class="diff" id="diff-30">-</div>
          </div>
          <div class="kpi-box">
            <div class="label">30일 주말</div>
            <div class="val" id="kpi-wknd">-</div>
            <div class="diff" id="diff-wknd">-</div>
          </div>
          <div class="kpi-box">
            <div class="label">60일 전체</div>
            <div class="val" id="kpi-60">-</div>
            <div class="diff" id="diff-60">-</div>
          </div>
        </div>
      </div>

      <div class="card" id="urgent-card" style="display:none;">
        <div class="card-title" style="color:var(--red);">🚨 긴급 가격 조정 알림</div>
        <div id="urgent-list"></div>
      </div>

      <div class="filter-tabs">
        <button class="filter-btn active" onclick="setRecFilter('all', this)">전체</button>
        <button class="filter-btn" onclick="setRecFilter('vacant', this)">공실만</button>
        <button class="filter-btn" onclick="setRecFilter('weekend', this)">주말만</button>
      </div>

      <div class="card" style="padding: 4px 10px;">
        <div id="daily-rec-container"></div>
      </div>
    </div>

    <!-- 탭 3: 숙소 프로필 -->
    <div id="tab-prof" class="tab-content">
      <div class="filter-tabs" style="margin-bottom:12px;">
        <button class="filter-btn active" onclick="sortProfiles('default', this)">기본 정렬</button>
        <button class="filter-btn" onclick="sortProfiles('occ', this)">점유율 높은순</button>
        <button class="filter-btn" onclick="sortProfiles('price', this)">평일요금 낮은순</button>
      </div>
      <div id="profiles-container"></div>
    </div>

    <!-- 탭 4: 숙소 진단 리포트 -->
    <div id="tab-audit" class="tab-content">
      <div class="card" id="audit-container"></div>
    </div>

  </div>

  <div class="tab-bar">
    <div class="tab-item active" onclick="switchTab('dash', this)">
      <div class="icon">📅</div>
      <div>대시보드</div>
    </div>
    <div class="tab-item" onclick="switchTab('rec', this)">
      <div class="icon">💡</div>
      <div>가격추천</div>
    </div>
    <div class="tab-item" onclick="switchTab('prof', this)">
      <div class="icon">🏨</div>
      <div>숙소프로필</div>
    </div>
    <div class="tab-item" onclick="switchTab('audit', this)">
      <div class="icon">📊</div>
      <div>진단리포트</div>
    </div>
  </div>

  <script>
    const APP_PIN = "1234";

    // 🔴 중요: 배포한 구글 웹 앱 URL을 아래 따옴표 안에 넣어주세요!
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxxTKI71ovSM8mDFKp0X-pRxv78ASmz5X842HxfKjVsPJJgYGJtucEOgmh1pgxvSCOV/exec";

    var globalData = null;
    var currentRecFilter = 'all';
    var profileSortMode = 'default';
    var isTransposedMode = false;

    window.onload = function() {
      if (localStorage.getItem("airbnb_auth_pin") === APP_PIN) {
        unlockApp();
      } else {
        document.getElementById("lock-screen").style.display = "flex";
      }

      document.getElementById("pin-input").addEventListener("keyup", function(e) {
        if (e.key === "Enter") verifyPin();
      });
    };

    function verifyPin() {
      var entered = document.getElementById("pin-input").value;
      if (entered === APP_PIN) {
        localStorage.setItem("airbnb_auth_pin", APP_PIN);
        unlockApp();
      } else {
        document.getElementById("pin-err").style.display = "block";
      }
    }

    function unlockApp() {
      document.getElementById("lock-screen").style.display = "none";
      fetchData();
    }

    function fetchData() {
      var loadingEl = document.getElementById('loading');
      loadingEl.style.display = 'block';
      loadingEl.innerHTML = '<div class="spinner"></div>시트 데이터를 분석하는 중...';

      // 타임스탬프 파라미터로 모바일 캐시 방지 및 리다이렉트 추적
      fetch(GAS_API_URL + "?t=" + new Date().getTime(), {
        method: "GET",
        redirect: "follow"
      })
      .then(function(res) {
        if (!res.ok) throw new Error("서버 응답 오류 (HTTP " + res.status + ")");
        return res.json();
      })
      .then(function(data) {
        if (data.error) throw new Error(data.message);
        onDataLoaded(data);
      })
      .catch(function(err) {
        console.error(err);
        loadingEl.innerHTML = 
          '<div style="color:var(--red); padding:20px;">' +
          '⚠️ 데이터 로딩 실패<br><br>' +
          '<small style="color:var(--text-sub);">' + err.message + '</small><br><br>' +
          '<button class="switch-mode-btn" style="margin:0 auto;" onclick="fetchData()">다시 시도</button>' +
          '</div>';
      });
    }

    function onDataLoaded(data) {
      globalData = data;
      document.getElementById('loading').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      document.getElementById('updated-at').innerText = '기준: ' + (data.updatedAt || '-');

      renderTabDash();
      renderTabRec();
      renderTabProf();
      renderTabAudit();
    }

    function switchTab(tabId, el) {
      document.querySelectorAll('.tab-content').forEach(function(c) { c.classList.remove('active'); });
      document.querySelectorAll('.tab-item').forEach(function(t) { t.classList.remove('active'); });
      document.getElementById('tab-' + tabId).classList.add('active');
      el.classList.add('active');
      window.scrollTo(0, 0);
    }

    function toggleMatrixMode() {
      isTransposedMode = !isTransposedMode;
      var guideText = document.getElementById('matrix-guide-text');
      var btnText = document.getElementById('btn-mode-text');

      if (isTransposedMode) {
        guideText.innerText = '숙소(세로) 뷰 (상단 3개 행 고정)';
        btnText.innerText = '날짜 기준(세로 스크롤)';
      } else {
        guideText.innerText = '날짜(세로) 뷰 (3열 고정)';
        btnText.innerText = '숙소 기준(가로 타임라인)';
      }
      renderTabDash();
    }

    function renderTabDash() {
      if (isTransposedMode) {
        renderTransposedDash();
      } else {
        renderStandardDash();
      }
    }

    // 모드 1: 기본 날짜 기준 뷰
    function renderStandardDash() {
      var m = globalData.matrixData;
      if (!m || !m.rows || m.rows.length === 0) return;

      var hHtml = '<tr><th class="col-fixed-1">날짜</th><th class="col-fixed-2">시장</th><th class="col-fixed-3">★' + m.myRoomTitle + '</th>';
      m.compTitles.forEach(function(title) { hHtml += '<th class="col-comp">' + title + '</th>'; });
      hHtml += '</tr>';
      document.getElementById('matrix-head').innerHTML = hHtml;

      var bHtml = '';
      m.rows.forEach(function(row) {
        var dayCls = (row.weekday === '토') ? 'day-sat' : ((row.weekday === '일') ? 'day-sun' : '');

        bHtml += '<tr>' +
          '<td class="col-fixed-1"><div>' + row.date + '</div><div class="' + dayCls + '" style="font-size:0.62rem;">(' + row.weekday + ')</div></td>' +
          '<td class="col-fixed-2"><div style="color:var(--yellow);font-weight:700;">' + row.marketRate + '%</div><div style="font-size:0.6rem;color:var(--text-sub);">' + row.marketCount + '</div></td>' +
          '<td class="col-fixed-3">' + makeCellContent(row.myRoom) + '</td>';

        row.comps.forEach(function(cRoom) { bHtml += '<td class="col-comp">' + makeCellContent(cRoom) + '</td>'; });
        bHtml += '</tr>';
      });
      document.getElementById('matrix-body').innerHTML = bHtml;
    }

    // 모드 2: 숙소 기준 타임라인 뷰
    function renderTransposedDash() {
      var m = globalData.matrixData;
      if (!m || !m.rows || m.rows.length === 0) return;

      var hHtml = '<tr><th class="col-fixed-trans">숙소 목록</th>';
      m.rows.forEach(function(r) {
        var dayCls = (r.weekday === '토') ? 'day-sat' : ((r.weekday === '일') ? 'day-sun' : '');
        hHtml += '<th class="col-day-trans"><div>' + r.date + '</div><div class="' + dayCls + '" style="font-size:0.62rem;">(' + r.weekday + ')</div></th>';
      });
      hHtml += '</tr>';
      document.getElementById('matrix-head').innerHTML = hHtml;

      var bHtml = '';

      bHtml += '<tr class="row-sticky-market"><td class="col-fixed-trans" style="color:var(--yellow);">📈 시장마감</td>';
      m.rows.forEach(function(r) {
        bHtml += '<td class="col-day-trans"><div style="color:var(--yellow);font-weight:700;">' + r.marketRate + '%</div><div style="font-size:0.6rem;color:var(--text-sub);">' + r.marketCount + '</div></td>';
      });
      bHtml += '</tr>';

      bHtml += '<tr class="row-sticky-my"><td class="col-fixed-trans is-my">★ ' + m.myRoomTitle + '</td>';
      m.rows.forEach(function(r) {
        bHtml += '<td class="col-day-trans">' + makeCellContent(r.myRoom) + '</td>';
      });
      bHtml += '</tr>';

      m.compTitles.forEach(function(title, cIdx) {
        bHtml += '<tr><td class="col-fixed-trans">' + title + '</td>';
        m.rows.forEach(function(r) {
          bHtml += '<td class="col-day-trans">' + makeCellContent(r.comps[cIdx]) + '</td>';
        });
        bHtml += '</tr>';
      });

      document.getElementById('matrix-body').innerHTML = bHtml;
    }

    function makeCellContent(room) {
      if (!room) return '-';
      var s = String(room.status || '-');
      var p = room.price || '-';
      var bCls = 'status-booked';
      if (s.indexOf('공실') !== -1) bCls = 'status-vacant';
      else if (s.indexOf('마감') !== -1) bCls = 'status-closed';

      var shortStatus = s;
      if (s.indexOf('마감') !== -1) shortStatus = s.replace(' ', '');
      else if (s.indexOf('공실') !== -1) shortStatus = '공실';

      return '<div class="cell-box"><span class="cell-badge ' + bCls + '">' + shortStatus + '</span><span class="cell-price">' + p + '</span></div>';
    }

    // 2. 가격 추천 탭
    function renderTabRec() {
      if (globalData.myProfile && globalData.marketAvg) {
        var p = globalData.myProfile;
        var m = globalData.marketAvg;
        setKpi('kpi-30', 'diff-30', Number(p.mOcc || 0), Number(m.mOcc || 0));
        setKpi('kpi-wknd', 'diff-wknd', Number(p.mWeekendOcc || 0), Number(m.mWeekendOcc || 0));
        setKpi('kpi-60', 'diff-60', Number(p.occ60 || 0), Number(m.occ60 || 0));
      }

      if (globalData.urgentActions && globalData.urgentActions.length > 0) {
        document.getElementById('urgent-card').style.display = 'block';
        var uHtml = '';
        globalData.urgentActions.forEach(function(it) {
          uHtml += '<div class="action-item"><div class="action-top">' +
            '<span>[' + it.dDay + '] ' + String(it.date).substring(5) + '(' + it.weekday + ')</span>' +
            '<span class="action-price">' + fmtPrice(it.suggestedPrice) + '</span></div>' +
            '<div class="action-desc">' + it.diagnosis + '</div></div>';
        });
        document.getElementById('urgent-list').innerHTML = uHtml;
      }
      renderRecList();
    }

    function setKpi(vId, dId, myV, avgV) {
      document.getElementById(vId).innerText = myV.toFixed(1) + '%';
      var diff = (myV - avgV).toFixed(1);
      var el = document.getElementById(dId);
      if (diff >= 0) {
        el.innerText = '+' + diff + '%p';
        el.className = 'diff plus';
      } else {
        el.innerText = diff + '%p';
        el.className = 'diff minus';
      }
    }

    function setRecFilter(mode, btn) {
      currentRecFilter = mode;
      document.querySelectorAll('#tab-rec .filter-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      renderRecList();
    }

    function renderRecList() {
      var cont = document.getElementById('daily-rec-container');
      var list = globalData.dailyRecs || [];
      var filtered = list.filter(function(d) {
        if (currentRecFilter === 'vacant') return String(d.myStatus).indexOf('공실') !== -1;
        if (currentRecFilter === 'weekend') return d.weekday === '금' || d.weekday === '토';
        return true;
      });

      var html = '';
      filtered.forEach(function(d) {
        var sCls = 'status-vacant';
        var myS = String(d.myStatus || '');
        if (myS.indexOf('마감') !== -1) sCls = 'status-closed';
        else if (myS.indexOf('예약') !== -1) sCls = 'status-booked';

        var sugg = (myS.indexOf('공실') !== -1 && d.suggestedPrice !== '-')
          ? '➔ ' + fmtPrice(d.suggestedPrice) : '';

        html += '<div class="daily-row">' +
          '<div class="date-col"><div class="date-main">' + String(d.date).substring(5) + ' <small>(' + d.weekday + ')</small></div><div class="date-sub">' + d.dDay + '</div></div>' +
          '<div class="status-badge ' + sCls + '">' + myS + '</div>' +
          '<div class="price-col"><div class="price-curr">' + fmtPrice(d.myPrice) + '</div><div class="price-sugg">' + sugg + '</div></div>' +
          '<div class="market-col">' + d.marketRate + '%</div></div>';
      });
      cont.innerHTML = html || '<div style="text-align:center;padding:20px;color:var(--text-sub);">내역이 없습니다.</div>';
    }

    // 3. 숙소 프로필 탭
    function sortProfiles(mode, btn) {
      profileSortMode = mode;
      document.querySelectorAll('#tab-prof .filter-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      renderTabProf();
    }

    function renderTabProf() {
      var cont = document.getElementById('profiles-container');
      var list = [];
      if (globalData.myProfile) list.push(globalData.myProfile);
      if (globalData.profiles) list = list.concat(globalData.profiles);

      var my = list.filter(function(p) { return p.isMyRoom; });
      var comps = list.filter(function(p) { return !p.isMyRoom; });

      if (profileSortMode === 'occ') {
        comps.sort(function(a, b) { return Number(b.mOcc || 0) - Number(a.mOcc || 0); });
      } else if (profileSortMode === 'price') {
        comps.sort(function(a, b) {
          var pA = parseInt(String(a.weekdayPrice).replace(/[^\d]/g, ''), 10) || 0;
          var pB = parseInt(String(b.weekdayPrice).replace(/[^\d]/g, ''), 10) || 0;
          return pA - pB;
        });
      }

      var displayList = my.concat(comps);
      var html = '';

      displayList.forEach(function(p) {
        var isMy = p.isMyRoom;
        var cardCls = isMy ? 'p-card is-my' : 'p-card';
        var badgeCls = isMy ? 'p-badge badge-my' : 'p-badge badge-comp';
        var badgeText = isMy ? '★ 내 숙소' : (p.category || '경쟁사');
        var airbnbUrl = p.roomId ? 'https://www.airbnb.co.kr/rooms/' + p.roomId : '#';

        var mOccVal = Number(p.mOcc || 0);
        var occ60Val = Number(p.occ60 || 0);
        var mWkndVal = Number(p.mWeekendOcc || 0);
        var wknd60Val = Number(p.weekendOcc60 || 0);
        var mWkdayVal = Number(p.mWeekdayOcc || 0);
        var wkday60Val = Number(p.weekdayOcc60 || 0);

        html += '<div class="' + cardCls + '">' +
          '<div class="p-header">' +
            '<a href="' + airbnbUrl + '" target="_blank" class="p-title-link">' +
              p.title + ' <span style="font-size:0.75rem; color:var(--accent);">↗</span>' +
            '</a>' +
            '<span class="' + badgeCls + '">' + badgeText + '</span>' +
          '</div>' +
          '<div class="p-specs">' +
            '<div>📍 ' + (p.address || '주소 정보 없음') + '</div>' +
            '<div>🏠 ' + (p.spec || '-') + ' | ⭐ ' + p.rating + ' (후기 ' + p.reviews + '개)</div>' +
          '</div>' +
          '<div class="p-pricing-box">' +
            '<div class="p-price-row">' +
              '<span>평일 <strong>' + fmtPrice(p.weekdayPrice) + '</strong></span>' +
              '<span>주말 <strong>' + fmtPrice(p.weekendPrice) + '</strong></span>' +
            '</div>' +
            '<div style="font-size:0.72rem; color:var(--accent);">👥 인원 정책: ' + (p.extraPolicy || '기준 인원 요금') + '</div>' +
          '</div>' +
          '<table class="p-matrix">' +
            '<thead><tr><th style="width:34%;">구분</th><th style="width:33%;">1개월 (30일)</th><th style="width:33%;">전체 (60일)</th></tr></thead>' +
            '<tbody>' +
              '<tr><td><strong>종합 점유율</strong></td><td><span class="' + getOccClass(mOccVal) + '">' + mOccVal.toFixed(1) + '%</span></td><td><span class="' + getOccClass(occ60Val) + '">' + occ60Val.toFixed(1) + '%</span></td></tr>' +
              '<tr><td>주말 점유율</td><td>' + mWkndVal.toFixed(0) + '%</td><td>' + wknd60Val.toFixed(0) + '%</td></tr>' +
              '<tr><td>평일 점유율</td><td>' + mWkdayVal.toFixed(0) + '%</td><td>' + wkday60Val.toFixed(0) + '%</td></tr>' +
            '</tbody>' +
          '</table>' +
        '</div>';
      });

      cont.innerHTML = html;
    }

    function getOccClass(val) {
      if (val >= 75) return 'occ-high';
      if (val >= 50) return 'occ-mid';
      return 'occ-low';
    }

    // 4. 진단 리포트 탭
    function renderTabAudit() {
      var cont = document.getElementById('audit-container');
      var sec = globalData.auditSections || [];
      if (sec.length === 0) {
        cont.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-sub);">진단 데이터 없음</div>';
        return;
      }

      var html = '';
      sec.forEach(function(s) {
        html += '<div style="margin-bottom:14px;"><div style="font-size:0.85rem;font-weight:700;color:var(--accent);margin-bottom:6px;">' + s.title + '</div>' +
          '<table class="audit-table">';
        s.rows.forEach(function(row, rIdx) {
          html += '<tr>';
          row.forEach(function(c) {
            html += (rIdx === 0 && isNaN(parseInt(c, 10))) ? '<th>' + c + '</th>' : '<td>' + c + '</td>';
          });
          html += '</tr>';
        });
        html += '</table></div>';
      });
      cont.innerHTML = html;
    }

    function fmtPrice(v) {
      if (!v || v === '-') return '-';
      var n = parseInt(String(v).replace(/[^\d]/g, ''), 10);
      return isNaN(n) ? v : '₩' + n.toLocaleString();
    }
  </script>
</body>
</html>
