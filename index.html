<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>숙소 모니터링</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- PIN 인증 잠금 화면 -->
  <div id="lock-screen">
    <div class="lock-box">
      <div class="lock-title">🔐 모니터링 시스템</div>
      <div class="lock-sub">접근 비밀번호 4자리를 입력하세요.</div>
      <input type="password" id="pin-input" class="pin-input" maxlength="4" pattern="[0-9]*" inputmode="numeric" placeholder="••••" autofocus>
      <button class="pin-btn" onclick="verifyPin()">대시보드 열기</button>
      <div id="pin-err" class="pin-err">비밀번호가 올바르지 않습니다.</div>
    </div>
  </div>

  <!-- 상단 헤더 -->
  <div class="header">
    <h1>에어비앤비 모니터링</h1>
    <div class="time" id="updated-at">-</div>
  </div>

  <!-- 로딩 스피너 -->
  <div id="loading">
    <div class="spinner"></div>
    시트 데이터를 분석하는 중...
  </div>

  <!-- 메인 앱 컨텐츠 -->
  <div id="app" style="display:none;">
    
    <!-- 탭 1: 숙소 프로필 (맨 첫 번째) -->
    <div id="tab-prof" class="tab-content">
      <div class="filter-tabs" style="margin-bottom:12px;">
        <button class="filter-btn active" onclick="sortProfiles('default', this)">기본 정렬</button>
        <button class="filter-btn" onclick="sortProfiles('occ', this)">점유율 높은순</button>
        <button class="filter-btn" onclick="sortProfiles('price', this)">평일요금 낮은순</button>
      </div>
      <div id="profiles-container"></div>
    </div>

    <!-- 탭 2: 종합 대시보드 -->
    <div id="tab-dash" class="tab-content active">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <span id="matrix-guide-text" style="font-size:0.73rem; color:var(--text-sub);">날짜(세로) 뷰 (3열 고정)</span>
        <button class="switch-mode-btn" onclick="toggleMatrixMode()">
          <span id="btn-mode-icon">⇄</span> <span id="btn-mode-text">숙소 기준(가로 타임라인)</span>
        </button>
      </div>
      <div class="matrix-wrapper">
        <table class="matrix-table" id="matrix-table">
          <thead id="matrix-head"></thead>
          <tbody id="matrix-body"></tbody>
        </table>
      </div>
    </div>

    <!-- 탭 3: 가격 추천 & 액션 보드 (개편) -->
    <div id="tab-rec" class="tab-content">
        <!-- 1. 2x2 실무형 KPI 바 (스크린샷 색감 매핑) -->
      <div class="kpi-grid-4">
        <div class="kpi-card kpi-red">
          <div class="kpi-title">D-7 이내 미판매</div>
          <div class="kpi-num" id="kpi-d7">-</div>
          <div class="kpi-sub">공실 방어 요망</div>
        </div>
        <div class="kpi-card kpi-green">
          <div class="kpi-title">30일 평일 점유율</div>
          <div class="kpi-num" id="kpi-wkday">-</div>
          <div class="kpi-sub" id="diff-wkday">-</div>
        </div>
        <div class="kpi-card kpi-blue">
          <div class="kpi-title">30일 주말 점유율</div>
          <div class="kpi-num" id="kpi-wknd">-</div>
          <div class="kpi-sub" id="diff-wknd">-</div>
        </div>
        <div class="kpi-card kpi-accent">
          <div class="kpi-title">60일 전체 점유율</div>
          <div class="kpi-num" id="kpi-60">-</div>
          <div class="kpi-sub" id="diff-60">-</div>
        </div>
      </div>

      <!-- 2. 오늘의 권장 조치 카드 (헤더 우측에 호스트 달력 버튼 배치) -->
      <div class="section-header">
        <div class="section-title">
          <span>⚡ 오늘의 권장 조치</span>
          <span style="font-size:0.7rem; color:var(--accent); font-weight:normal;">(Top 3)</span>
        </div>
        <a href="https://www.airbnb.co.kr/hosting/calendar" target="_blank" class="btn-airbnb-main">
          호스트 달력 열기 ↗
        </a>
      </div>
      <div class="section-desc">시장 상황을 반영하여 아래 추천 요금으로 에어비앤비 달력을 조정하세요.</div>

      <div class="action-summary-container" id="urgent-list"></div>

      <!-- 3. 60일 전체 진단 & 경쟁사 공실 현황 -->
      <div class="section-title" style="margin-bottom:10px;">
        <span>📅 60일 전체 진단 & 경쟁사 공실 현황</span>
      </div>

      <!-- 4개 필터 탭 -->
      <div class="filter-tabs">
        <button class="filter-btn active" onclick="setRecFilter('all', this)">전체(60일)</button>
        <button class="filter-btn" onclick="setRecFilter('my_vacant', this)">내 공실만</button>
        <button class="filter-btn" onclick="setRecFilter('weekday', this)">평일만</button>
        <button class="filter-btn" onclick="setRecFilter('weekend', this)">주말만</button>
      </div>

      <div class="list-card" id="daily-rec-container"></div>
    </div>

    <!-- 탭 4: 숙소 진단 리포트 -->
    <div id="tab-audit" class="tab-content">
      <div class="card" id="audit-container"></div>
    </div>

  </div>

  <!-- 하단 탭 바 (숙소프로필 맨 앞) -->
  <div class="tab-bar">
    <div class="tab-item" onclick="switchTab('prof', this)">
      <div class="icon">🏨</div>
      <div>숙소프로필</div>
    </div>
    <div class="tab-item active" onclick="switchTab('dash', this)">
      <div class="icon">📅</div>
      <div>대시보드</div>
    </div>
    <div class="tab-item" onclick="switchTab('rec', this)">
      <div class="icon">💡</div>
      <div>가격추천</div>
    </div>
    <div class="tab-item" onclick="switchTab('audit', this)">
      <div class="icon">📊</div>
      <div>진단리포트</div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
